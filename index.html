<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDKEY — Генератор договора</title>

<!--
  ВАЖНО:
  Все библиотеки должны лежать в папке libs рядом с этим index.html.
  Никаких CDN/API для генерации DOCX/PDF не используется.
-->
<script src="./libs/pizzip.min.js"></script>
<script src="./libs/docxtemplater.js"></script>
<script src="./libs/file-saver.min.js"></script>
<script src="./libs/docx-preview.min.js"></script>
<script src="./libs/html2canvas.min.js"></script>
<script src="./libs/jspdf.umd.min.js"></script>

<style>
:root{
  --red:#c62828;
  --green:#2e9b4b;
  --lime:#dff2b3;
  --bg:#f5f6f7;
  --border:#d6d8dc;
  --text:#202124;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.hidden{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:28px 18px 60px}
.card{background:#fff;border-radius:16px;box-shadow:0 5px 25px rgba(0,0,0,.08);padding:24px}
h1{margin:0 0 6px;font-size:28px}
h2{margin:24px 0 14px;font-size:20px}
.subtitle{color:#666;margin-bottom:22px}
.login{max-width:420px;margin:12vh auto}
.login h1{text-align:center}
input,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff}
input:focus,textarea:focus{outline:2px solid #d8ebaf}
button{border:0;border-radius:9px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.btn-red{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-gray{background:#e9ebee}
.error{color:#b00020;font-size:14px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:5px}
.lime{background:var(--lime)!important}
.required-bad{background:#ff4b4b!important;color:#fff}
.line{height:1px;background:#ddd;margin:22px 0}
.service{border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0}
.service-title{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px}
.service-title input{width:auto}
.service-body{margin-top:12px}
.service-row{display:grid;grid-template-columns:1.1fr 1fr 1.1fr 1.1fr;gap:9px;align-items:end}
.service-row .field label{font-size:12px}
.cost{font-weight:700}
textarea{min-height:100px;resize:vertical}
.summary{background:#f0f7df;border:1px solid #cde4a3;border-radius:12px;padding:15px}
.actions{display:flex;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.status{font-weight:700}
.note{font-size:13px;color:#666;line-height:1.45}
#pdfRenderHost{
  position:fixed;
  left:-100000px;
  top:0;
  width:794px;
  background:white;
  z-index:-1;
}
#docxPreview{
  width:794px;
  background:white;
}
.preview-visible{
  margin-top:22px;
  border:1px solid #ccc;
  border-radius:10px;
  overflow:auto;
  background:#ddd;
  padding:20px;
  max-height:720px;
}
@media(max-width:760px){
 .grid,.service-row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<section id="loginScreen" class="wrap">
  <div class="card login">
    <h1>IDKEY</h1>
    <div class="subtitle" style="text-align:center">Введите пароль для доступа</div>
    <input id="password" type="password" placeholder="Пароль" autocomplete="off">
    <button id="loginBtn" class="btn-red" style="width:100%;margin-top:12px">Войти</button>
    <div id="loginError" class="error hidden">Неверный пароль</div>
  </div>
</section>

<section id="app" class="wrap hidden">
<div class="card">

<h1>Начинаем наше лудо-приключение</h1>
<div class="subtitle">Основные данные клиента</div>

<div class="grid">
  <div class="field">
    <label>Договор сегодня *</label>
    <input id="contractNo" type="text" value="1">
  </div>

  <div class="field">
    <label>Дата договора</label>
    <input id="date" class="lime" type="text" readonly>
  </div>

  <div class="field">
    <label>ФИО *</label>
    <input id="fio" type="text">
  </div>

  <div class="field">
    <label>ИНН *</label>
    <input id="inn" type="text">
  </div>

  <div class="field">
    <label>Активная мобила *</label>
    <input id="phone" type="text">
  </div>

  <div class="field">
    <label>Точный адрес объекта</label>
    <input id="address" type="text">
  </div>

  <div class="field">
    <label>Общая квадратура *</label>
    <input id="area" type="number" min="0" step="0.01">
  </div>
</div>

<div class="line"></div>
<h2>Услуги</h2>

<div class="service">
  <div class="service-title">
    <input id="tech1Check" type="checkbox" checked>
    План расстановки мебели
  </div>
  <div class="service-body">
    <div class="service-row">
      <div class="field"><label>S=</label><input id="tech1Area" type="number" step="0.01" class="lime"></div>
      <div class="field"><label>Срок, дн</label><input id="tech1Days" type="number" value="10" class="lime"></div>
      <div class="field"><label>P= (р/кв.м)</label><input id="tech1Tariff" type="number" value="350" class="lime"></div>
      <div class="field"><label>Стоимость</label><input id="tech1Cost" class="lime cost" readonly></div>
    </div>
  </div>
</div>

<div class="service">
  <div class="service-title">
    <input id="tech2Check" type="checkbox" checked>
    Вторая часть технички
  </div>
  <div class="service-body">
    <div class="service-row">
      <div class="field"><label>S=</label><input id="tech2Area" type="number" step="0.01" class="lime"></div>
      <div class="field"><label>Срок, дн</label><input id="tech2Days" type="number" value="10" class="lime"></div>
      <div class="field"><label>P= (р/кв.м)</label><input id="tech2Tariff" type="number" value="300" class="lime"></div>
      <div class="field"><label>Стоимость</label><input id="tech2Cost" class="lime cost" readonly></div>
    </div>

</div>

<div class="service">
  <div class="service-title">

  </div>

    <div class="service-row">
      <div class="field"><label>S=</label><input id="visualArea" type="number" step="0.01"></div>
      <div class="field"><label>Срок, дн</label><input id="visualDays" type="number" value="7"></div>
      <div class="field"><label>P= (р/кв.м)</label><input id="visualTariff" type="number" value="750"></div>
      <div class="field"><label>Стоимость</label><input id="visualCost" class="lime cost" readonly></div>

</div>

<div class="service">
  <div class="service-title">
    <input id="collageCheck" type="checkbox">

  <div class="service-body">
    <div class="service-row">
      <div class="field"><label>N= ракурсов</label><input id="collageN" type="number" min="1" value="1"></div>
      <div class="field"><label>Срок, дн</label><input id="collageDays" type="number" value="7"></div>
      <div class="field"><label>P= (р/ракурс)</label><input id="collageTariff" type="number" value="3000"></div>
      <div class="field"><label>Стоимость</label><input id="collageCost" class="lime cost" readonly></div>
    </div>

    <div class="field" style="margin-top:12px">
      <label>Подробнее</label>
      <textarea id="collageOption">Количество 2D-коллажей – 4 ракурса. Помещения: Кухня-гостиная (2 ракурса), Спальня (1 ракурс), Санузел (1 ракурс)</textarea>
    </div>

</div>

<div class="service">
  <div class="service-title">
    <input id="tableCheck" type="checkbox">
    Таблица комплектации
  </div>
  <div class="service-body">
    <div class="service-row">
      <div class="field"><label>S=</label><input id="tableArea" type="number" step="0.01"></div>
      <div class="field"><label>Срок, дн</label><input id="tableDays" type="number" value="7"></div>
      <div class="field"><label>PR / тариф</label><input id="tableTariff" type="number" value="200"></div>
      <div class="field"><label>Стоимость</label><input id="tableCost" class="lime cost" readonly></div>
    </div>
  </div>
</div>

<div class="line"></div>

<div class="summary">
  <b>Общая сумма:</b> <span id="totalSum">0</span> ₽
  <div style="margin-top:7px"><b>Прописью:</b> <span id="totalWords">ноль рублей</span></div>
  <div style="margin-top:7px"><b>Общий срок:</b> <span id="totalDays">0</span> раб. дней</div>
</div>

<div class="actions">
  <button id="generateBtn" class="btn-red">Составить договор</button>
  <span id="status" class="status"></span>
</div>

<div id="errorBox" class="error hidden"></div>

<div id="downloadArea" class="actions hidden">
  <button id="downloadWord" class="btn-green">Скачать Word</button>
  <button id="downloadPdf" class="btn-green">Скачать PDF</button>
</div>

<div id="previewSection" class="hidden">
  <h2>Предпросмотр PDF</h2>
  <div class="preview-visible">
    <div id="docxPreview"></div>
  </div>
</div>

</div>
</section>

<!-- Hidden renderer. It is also used to create the PDF. -->
<div id="pdfRenderHost">
  <div id="pdfRender"></div>
</div>

<script>
/* =========================================================
   CONFIGURATION
   ========================================================= */

const PASSWORD = '2507';

/*
  Положи EXAMPLE.docx рядом с index.html.
  Тогда приложение вообще не зависит от GitHub URL.
*/
const TEMPLATE_URL = './EXAMPLE.docx';


/* =========================================================
   BASIC HELPERS
   ========================================================= */

const $ = id => document.getElementById(id);

function clean(v){
  return String(v ?? '').replace(/\s+/g,' ').trim();
}

function num(id){
  return Number($(id).value) || 0;
}

function money(v){
  return Math.round(Number(v) || 0).toLocaleString('ru-RU');
}


/* =========================================================
   DATE / CONTRACT NUMBER
   ========================================================= */

function getContractDate(){
  const d = new Date();

  const months = [
    'января','февраля','марта','апреля','мая','июня',
    'июля','августа','сентября','октября','ноября','декабря'
  ];

  /*
    Число специально НЕ вставляется.
    Результат:
    «   » августа 2026
  */
  return `«   » ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function getContractNumber(){
  const d = new Date();

  const day = String(d.getDate()).padStart(2,'0');
  const month = String(d.getMonth()+1).padStart(2,'0');
  const year = String(d.getFullYear()).slice(-2);

  return `${day}${month}/${year}-${clean($('contractNo').value)}`;
}

$('date').value = getContractDate();


/* =========================================================
   NUMBER TO WORDS — 1..599999
   ========================================================= */

function numberToWordsRu(number){
  number = Math.round(Number(number) || 0);

  if(number === 0) return 'ноль';
  if(number < 0 || number > 599999) return '';

  const onesMale = [
    '',
    'один','два','три','четыре','пять',
    'шесть','семь','восемь','девять'
  ];

  const onesFemale = [
    '',
    'одна','две','три','четыре','пять',
    'шесть','семь','восемь','девять'
  ];

  const teens = [
    'десять','одиннадцать','двенадцать','тринадцать',
    'четырнадцать','пятнадцать','шестнадцать',
    'семнадцать','восемнадцать','девятнадцать'
  ];

  const tens = [
    '','','двадцать','тридцать','сорок',
    'пятьдесят','шестьдесят','семьдесят',
    'восемьдесят','девяносто'
  ];

  const hundreds = [
    '',
    'сто','двести','триста','четыреста','пятьсот'
  ];

  function under1000(n, female=false){
    const result=[];

    if(n >= 100){
      result.push(hundreds[Math.floor(n/100)]);
      n %= 100;
    }

    if(n >= 10 && n <= 19){
      result.push(teens[n-10]);
      return result.join(' ');
    }

    if(n >= 20){
      result.push(tens[Math.floor(n/10)]);
      n %= 10;
    }

    if(n > 0){
      result.push((female ? onesFemale : onesMale)[n]);
    }

    return result.join(' ');
  }

  function thousandWord(n){
    const lastTwo = n % 100;
    const last = n % 10;

    if(lastTwo >= 11 && lastTwo <= 19) return 'тысяч';
    if(last === 1) return 'тысяча';
    if(last >= 2 && last <= 4) return 'тысячи';
    return 'тысяч';
  }

  const result=[];
  const thousands=Math.floor(number/1000);
  const remainder=number%1000;

  if(thousands > 0){
    result.push(under1000(thousands,true));
    result.push(thousandWord(thousands));
  }

  if(remainder > 0){
    result.push(under1000(remainder,false));
  }

  return result.join(' ');
}


/* =========================================================
   CALCULATION
   ========================================================= */

function recalc(){
  if(!$('tech1Area').value) $('tech1Area').value=$('area').value;
  if(!$('tech2Area').value) $('tech2Area').value=$('area').value;
  if(!$('visualArea').value) $('visualArea').value=$('area').value;
  if(!$('tableArea').value) $('tableArea').value=$('area').value;

  const tech1Cost=num('tech1Area')*num('tech1Tariff');
  const tech2Cost=num('tech2Area')*num('tech2Tariff');
  const visualCost=num('visualArea')*num('visualTariff');
  const collageCost=num('collageN')*num('collageTariff');
  const tableCost=num('tableArea')*num('tableTariff');

  $('tech1Cost').value=money(tech1Cost);
  $('tech2Cost').value=money(tech2Cost);
  $('visualCost').value=money(visualCost);
  $('collageCost').value=money(collageCost);
  $('tableCost').value=money(tableCost);

  let total=0;
  let days=0;

  if($('tech1Check').checked){
    total+=tech1Cost;
    days+=num('tech1Days');
  }

  if($('tech2Check').checked){
    total+=tech2Cost;
    days+=num('tech2Days');
  }

  if($('visualCheck').checked){
    total+=visualCost;
    days+=num('visualDays');
  }

  if($('collageCheck').checked){
    total+=collageCost;
    days+=num('collageDays');
  }

  if($('tableCheck').checked){
    total+=tableCost;
    days+=num('tableDays');
  }

  $('totalSum').textContent=money(total);
  $('totalWords').textContent=numberToWordsRu(total)+' рублей';
  $('totalDays').textContent=days;

  return {total,days,tech1Cost,tech2Cost,visualCost,collageCost,tableCost};
}


/* =========================================================
   FORM -> WORD VARIABLES
   ========================================================= */

function collect(){
  const c=recalc();

  return {
    CONTRACT_NO:getContractNumber(),
    DATE:getContractDate(),

    FIO:clean($('fio').value),
    INN:clean($('inn').value),
    PHONE:clean($('phone').value),
    PHON:clean($('phone').value),
    ADDRESS:clean($('address').value),
    AREA:clean($('area').value),

    TOTAL_DAYS:String(c.days),
    TOTAL_SUM:money(c.total),
    TOTAL_SUM_WORDS:numberToWordsRu(c.total),

    TECH1_AREA:clean($('tech1Area').value),
    TECH1_DAYS:clean($('tech1Days').value),
    TECH1_PR:money(c.tech1Cost),
    TECH1_COST:money(c.tech1Cost),

    TECH2_AREA:clean($('tech2Area').value),
    TECH2_DAYS:clean($('tech2Days').value),
    TECH2_PR:money(c.tech2Cost),
    TECH2_COST:money(c.tech2Cost),

    '3D_AREA':clean($('visualArea').value),
    '3D_DAYS':clean($('visualDays').value),
    '3D_PR':money(c.visualCost),
    '3D_COST':money(c.visualCost),
    '3D_80':money(c.visualCost*0.8),
    '3D_20':money(c.visualCost*0.2),

    '2D_OPTION':clean($('collageOption').value),
    '2D_DAYS':clean($('collageDays').value),
    '2D_PR':money(c.collageCost),
    '2D_COST':money(c.collageCost),
    '2D_80':money(c.collageCost*0.8),
    '2D_20':money(c.collageCost*0.2),

    TABLE_AREA:clean($('tableArea').value),
    TABLE_DAYS:clean($('tableDays').value),
    TABLE_PR:money(c.tableCost),
    TABLE_COST:money(c.tableCost),

    TECH_TOTAL:money(
      ($('tech1Check').checked ? c.tech1Cost : 0) +
      ($('tech2Check').checked ? c.tech2Cost : 0)
    )
  };
}


/* =========================================================
   VALIDATION
   ========================================================= */

function validate(){
  const required=[
    ['contractNo','Договор сегодня'],
    ['fio','ФИО'],
    ['inn','ИНН'],
    ['phone','Активная мобила'],
    ['area','Общая квадратура']
  ];

  const bad=[];

  required.forEach(([id,name])=>{
    const el=$(id);

    if(!clean(el.value)){
      el.classList.add('required-bad');
      bad.push(name);
    }else{
      el.classList.remove('required-bad');
    }
  });

  const services=[
    'tech1Check','tech2Check','visualCheck','collageCheck','tableCheck'
  ];

  if(!services.some(id=>$(id).checked)){
    bad.push('хотя бы одна услуга');
  }

  return bad;
}


/* =========================================================
   DOCX GENERATION
   ========================================================= */

let lastDocxBlob=null;

async function createDocx(){
  const response=await fetch(TEMPLATE_URL,{cache:'no-store'});

  if(!response.ok){
    throw new Error(
      'Не найден EXAMPLE.docx. Положи его рядом с index.html.'
    );
  }

  const arrayBuffer=await response.arrayBuffer();

  const zip=new PizZip(arrayBuffer);

  const doc=new window.docxtemplater(zip,{
    paragraphLoop:true,
    linebreaks:true,
    delimiters:{
      start:'{{',
      end:'}}'
    }
  });

  doc.render(collect());

  return doc.getZip().generate({
    type:'blob',
    mimeType:
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
  });
}


/* =========================================================
   DOCX -> HTML RENDER
   =========================================================

   docx-preview renders the generated DOCX locally in the browser.
   The resulting DOM is then rasterized page-by-page into PDF.
*/

async function renderDocxToPreview(blob, visible=true){
  const container=visible ? $('docxPreview') : $('pdfRender');

  container.innerHTML='';

  await docx.renderAsync(
    blob,
    container,
    null,
    {
      className:'docx',
      inWrapper:true,
      breakPages:true,
      ignoreWidth:false,
      ignoreHeight:false,
      ignoreFonts:false,
      renderHeaders:true,
      renderFooters:true
    }
  );

  return container;
}


/* =========================================================
   HTML -> PDF
   ========================================================= */

async function makePdfFromRenderedDocx(){
  const host=$('pdfRender');

  if(!host.children.length){
    throw new Error('Предпросмотр DOCX ещё не отрисован.');
  }

  /*
    docx-preview creates page wrappers. We deliberately search
    for common page wrapper classes and fall back to the whole document.
  */
  let pages=[
    ...host.querySelectorAll('.docx-wrapper > section')
  ];

  if(!pages.length){
    pages=[
      ...host.querySelectorAll('section.docx')
    ];
  }

  if(!pages.length){
    pages=[host];
  }

  const {jsPDF}=window.jspdf;

  const pdf=new jsPDF({
    orientation:'portrait',
    unit:'mm',
    format:'a4',
    compress:true
  });

  const pageWidth=210;
  const pageHeight=297;
  const margin=0;

  let first=true;

  for(const page of pages){
    const canvas=await html2canvas(page,{
      scale:2,
      useCORS:true,
      backgroundColor:'#ffffff',
      logging:false,
      imageTimeout:15000
    });

    const img=canvas.toDataURL('image/jpeg',0.95);

    const ratio=Math.min(
      pageWidth/canvas.width,
      pageHeight/canvas.height
    );

    const w=canvas.width*ratio;
    const h=canvas.height*ratio;

    const x=(pageWidth-w)/2;
    const y=(pageHeight-h)/2;

    if(!first) pdf.addPage();
    first=false;

    pdf.addImage(
      img,
      'JPEG',
      x,
      y,
      w,
      h,
      undefined,
      'FAST'
    );
  }

  return pdf.output('blob');
}


/* =========================================================
   GENERATE
   ========================================================= */

async function generate(){
  $('errorBox').classList.add('hidden');
  $('status').textContent='';

  const bad=validate();

  if(bad.length){
    $('status').textContent='✕';
    $('status').style.color='var(--red)';
    $('errorBox').textContent=
      'Не все поля заполнены: '+bad.join(', ');
    $('errorBox').classList.remove('hidden');
    return;
  }

  $('generateBtn').disabled=true;
  $('status').textContent='Формируем Word…';

  try{
    lastDocxBlob=await createDocx();

    $('downloadWord').onclick=()=>{
      saveAs(
        lastDocxBlob,
        `Договор_${getContractNumber().replaceAll('/','-')}.docx`
      );
    };

    $('downloadArea').classList.remove('hidden');

    $('status').textContent='Рендерим документ…';

    /*
      Visible preview.
    */
    await renderDocxToPreview(lastDocxBlob,true);

    /*
      Separate hidden copy is used for PDF generation.
    */
    await renderDocxToPreview(lastDocxBlob,false);

    $('previewSection').classList.remove('hidden');

    $('status').textContent='Готовим PDF…';

    const pdfBlob=await makePdfFromRenderedDocx();

    $('downloadPdf').onclick=()=>{
      saveAs(
        pdfBlob,
        `Договор_${getContractNumber().replaceAll('/','-')}.pdf`
      );
    };

    $('status').textContent='✓ Договор готов';
    $('status').style.color='var(--green)';

  }catch(error){
    console.error(error);

    $('status').textContent='✕';
    $('status').style.color='var(--red)';

    let message=error.message || String(error);

    if(error.properties && error.properties.errors){
      message=error.properties.errors
        .map(e=>e.properties?.explanation || e.message)
        .join('; ');
    }

    $('errorBox').textContent='Ошибка: '+message;
    $('errorBox').classList.remove('hidden');

  }finally{
    $('generateBtn').disabled=false;
  }
}


/* =========================================================
   LOGIN / EVENTS
   ========================================================= */

function login(){
  if($('password').value===PASSWORD){
    $('loginScreen').classList.add('hidden');
    $('app').classList.remove('hidden');
  }else{
    $('loginError').classList.remove('hidden');
  }
}

$('loginBtn').onclick=login;

$('password').addEventListener('keydown',e=>{
  if(e.key==='Enter') login();
});

document.querySelectorAll('input,textarea').forEach(el=>{
  el.addEventListener('input',recalc);
});

document.querySelectorAll('input[type=checkbox]').forEach(el=>{
  el.addEventListener('change',recalc);
});

$('area').addEventListener('input',()=>{
  ['tech1Area','tech2Area','visualArea','tableArea'].forEach(id=>{
    if(!$(id).dataset.manual){
      $(id).value=$('area').value;
    }
  });

  recalc();
});

['tech1Area','tech2Area','visualArea','tableArea'].forEach(id=>{
  $(id).addEventListener('input',()=>{
    $(id).dataset.manual='1';
  });
});

$('generateBtn').onclick=generate;

recalc();
</script>
